name: Opdater Ministerienyt

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Generer hjemmeside og RSS
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p site
          python ministerienyt.py \
            --html-output site/index.html \
            --rss-output site/feed.xml \
            --status-output site/status.json \
            --site-url "$PAGES_URL" \
            --feed-url "${PAGES_URL}feed.xml"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
