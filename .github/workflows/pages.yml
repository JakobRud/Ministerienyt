name: Opdater Ministerienyt

on:
  workflow_dispatch:
    inputs:
      full_audit:
        description: "Gennemtving fuld kontrol af alle 2026-arkiver og sitemaps"
        required: false
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths-ignore:
      - "archive.json"
      - "rejected_candidates.json"
      - "health.json"
      - "diagnostics.json"
      - "diagnostics.html"
      - "source_state.json"
      - "alerts.json"
      - "source_audit.json"
  schedule:
    # To almindelige forsøg pr. time mindsker virkningen af forsinkede/droppede schedules.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
    # Månedlig fuld audit: historiske ruter og sitemaps gennemtvinges uanset cache.
    - cron: "23 6 1 * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Hent repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Kør regressionstests
        run: python regression_tests.py -v

      - name: Generer hjemmeside, arkiv og kvalitetsdata
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p site
          AUDIT_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "23 6 1 * *" ]; then
            AUDIT_FLAG="--full-audit"
            echo "Kører månedlig fuld kildeaudit."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_audit }}" = "true" ]; then
            AUDIT_FLAG="--full-audit"
            echo "Kører manuelt valgt fuld kildeaudit."
          fi
          python ministerier_nyheder.py \
            --archive archive.json \
            --html-output site/index.html \
            --rss-output site/feed.xml \
            --health-output health.json \
            --status-output site/status.json \
            --diagnostics-output diagnostics.json \
            --diagnostics-html diagnostics.html \
            --source-state source_state.json \
            --alerts-output alerts.json \
            --source-audit-output source_audit.json \
            --rejected-log rejected_candidates.json \
            --config site_config.json \
            --site-url "$PAGES_URL" \
            --feed-url "${PAGES_URL}feed.xml" \
            $AUDIT_FLAG

      - name: Gem arkiv og intern kvalitetsstatus i repositoryet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json rejected_candidates.json health.json diagnostics.json diagnostics.html source_state.json alerts.json source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Opdater nyhedsarkiv og kvalitetsstatus [skip ci]"
            git push
          else
            echo "Arkiv og kvalitetsfiler er uændrede."
          fi

      - name: Upload hjemmeside
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Udgiv GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
