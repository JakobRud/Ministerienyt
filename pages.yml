name: Opdater Ministerienyt

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Generer hjemmeside og RSS
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p site
          python ministerier_nyheder.py \
            --html-output site/index.html \
            --rss-output site/feed.xml \
            --site-url "$PAGES_URL" \
            --feed-url "${PAGES_URL}feed.xml"

      - name: Upload hjemmeside
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Udgiv GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
