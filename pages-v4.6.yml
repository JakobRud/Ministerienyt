name: Opdater Ministerienyt

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "archive.json"
      - "rejected_candidates.json"
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Hent repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Generer hjemmeside, arkiv og RSS
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p site
          python ministerier_nyheder.py \
            --archive archive.json \
            --html-output site/index.html \
            --rss-output site/feed.xml \
            --status-output site/status.json \
            --rejected-log rejected_candidates.json \
            --site-url "$PAGES_URL" \
            --feed-url "${PAGES_URL}feed.xml"

      - name: Gem arkiv og afvisningslog i repositoryet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json rejected_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Opdater nyhedsarkiv [skip ci]"
            git push
          else
            echo "Arkiv og afvisningslog er uændret."
          fi

      - name: Upload hjemmeside
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Udgiv GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
